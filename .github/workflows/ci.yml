# MPSSAA record book pipeline — CI.
#
# No LLM calls are made in CI. The pipeline is: run the deterministic test suite,
# then prove the committed cache/extractions/ can rebuild data/ byte-for-byte
# (modulo provenance) with --offline, then run the verification gates on each
# season's committed data.
#
# NOTE: the rebuild and verify jobs require `make extract-all` to have been run
# locally first (to populate the cache and refresh data/). Until the cache is
# committed, rebuild-offline fails at the first cache miss and verify fails on
# the era-floor gates — both are expected on a code-only PR before the first
# extraction run. Once data/ + cache/ are committed, all three jobs go green.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync
      - name: pytest
        run: uv run pytest -q

  # Prove the committed cache reproduces data/ with zero LLM calls, then run
  # the verification gates. Depends on Phase 7 extraction having been run and
  # committed (cache/extractions/ + data/). Skips gracefully when no cache is
  # present yet so a code-only PR doesn't hard-fail on a known gap.
  rebuild-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync
      - name: Check for committed extraction cache
        id: cache
        run: |
          if [ -d cache/extractions ] && [ -n "$(ls -A cache/extractions 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No committed cache/extractions/ — skipping rebuild/verify until extraction is run (see make extract-all)."
          fi
      - name: Rebuild from cache (offline) and diff vs committed data
        if: steps.cache.outputs.present == 'true'
        run: make rebuild-offline
      - name: Verify each season
        if: steps.cache.outputs.present == 'true'
        run: make verify