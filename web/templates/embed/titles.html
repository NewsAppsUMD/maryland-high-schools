<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ school.name }} state titles</title>
<style>
  :root { --ink:#1a1a1a; --bg:#fff; --muted:#5a6470; --accent:#b3001b; --link:#1a5490; }
  :root[data-theme="dark"] { --ink:#e8eaed; --bg:#121417; --muted:#9aa3ad; --link:#7db4ec; }
  * { box-sizing:border-box; }
  body { margin:0; padding:12px 14px; font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  .card { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .num { font-size:2.4rem; font-weight:800; color:var(--accent); line-height:1; }
  .label { font-weight:600; }
  .sub { color:var(--muted); font-size:12px; margin-top:6px; }
  .sub a { color:var(--link); text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <span class="num">{{ school.total_titles }}</span>
    <span class="label">state title{{ 's' if school.total_titles != 1 else '' }}</span>
  </div>
  <div class="sub">
    <a href="{{ school_url }}" target="_blank" rel="noopener">{{ school.name }}</a>
    &middot; across {{ sports_count }} sport{{ 's' if sports_count != 1 else '' }}
    {% if school.last_title %}&middot; last in {{ school.last_title }}{% endif %}
  </div>
  <script>var t=new URLSearchParams(location.search).get('theme');if(t==='dark')document.documentElement.dataset.theme='dark';</script>
</body>
</html>
